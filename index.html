<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto MVP - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</head>
<body>

    <main>
        <h1>Formulário de Atendimento</h1>
        <p>Preencha os dados abaixo para enviar sua solicitação:</p>
    <div class="container" >
        <form action="#" method="POST">
            <div class="form-label">
                <div class="form-control">
            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" id="nome" placeholder="Digite seu nome" required>
            </div>

            <br>

            <div>
                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" id="email" placeholder="seuemail@email.com" required>
                <div class="form-text"></div>
            </div>
            <div class="form-text"><div class="form-text"></div>
                    <option value="orcamento">Solicitar Orçamento</option>
                    <option value="suporte">Suporte Técnico</option>
                </select>
            </div>

            <div class="form-text">
                <div class="text-center">
                    <div class="text-muted">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>

            <button class="btn-solid theme-primary" type="submit">Enviar Solicitação</button>
        </form>
    </div>

        
    </main>

    <footer>
        <p>Desenvolvido por: <strong>Heloise Lopes Lacerda</strong> — 2026</p>
        <p><small>Projeto MVP • Colégio Bento Munhoz</small></p>
    </footer>

</body>
</html>
